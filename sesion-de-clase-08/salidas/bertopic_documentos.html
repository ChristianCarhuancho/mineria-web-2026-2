a concreta.","El proceso de verificacion en dos pasos fallo varias veces y bloqueo temporalmente mi cuenta.","El formulario de contacto no envio mi mensaje la primera vez y tuve que intentarlo tres veces distintas.","El tiempo de respuesta por WhatsApp fue mejor que por correo electronico.","Pedi una factura por RUC y me la enviaron con datos incorrectos dos veces seguidas. Recien a la tercera solicitud lograron corregirla bien.","El sitio se cayo un momento durante una oferta especial, tuve que reintentar la compra.","Me cobraron el envio dos veces por un error del sistema y tuve que escribir tres correos distintos para que me lo revirtieran. La solucion tardo mas de una semana en llegar.","Pedi eliminar mis datos personales segun la politica de privacidad y el proceso tardo mas de un mes en completarse.","Cancele mi cuenta y me siguieron llegando correos promocionales durante semanas. Tuve que darme de baja manualmente de cada lista.","Intente actualizar mi metodo de pago y el sistema me mostro un error generico sin mas detalles.","Un vendedor de soporte me dio informacion incorrecta sobre un plazo de entrega y tuve que reprogramar mis planes.","Me cobraron dos veces por error y tuve que esperar varios dias para que me reembolsaran.","El seguimiento del pedido no siempre se actualiza en tiempo real, a veces se queda igual por dos dias. Al final el paquete llego bien pero la informacion no era precisa.","El envio se retraso mas de lo que indicaba el seguimiento del pedido.","La factura electronica llego con datos incorrectos y tuve que pedir que la corrigieran.","El tiempo de respuesta del correo de soporte es aceptable, normalmente en menos de 24 horas.","El envio internacional tardo mas dias de los indicados originalmente.","El proceso de creacion de cuenta pide verificar el correo pero el enlace tardo en llegar.","El sitio me cerro sesion a mitad del pago y perdi el carrito completo que habia armado. Tuve que rehacer todo el pedido desde cero.","El tiempo de espera en la linea telefonica de soporte supero los veinte minutos en horario de oficina.","El chat de soporte demoro mas de media hora en responder un dia de alta demanda.","Tuve problemas para aplicar un cupon de descuento durante el checkout.","El correo de bienvenida ofrecia un descuento que nunca pude aplicar en el checkout. Escribi a soporte pero no me dieron una explicacion clara.","El servicio al cliente respondio mis dudas por chat en menos de cinco minutos.","Mi cupon de bienvenida expiro antes de poder usarlo, la vigencia era demasiado corta para el tramite que exigian.","Intente hacer una devolucion y el proceso fue confuso, nadie me explico bien los pasos.","El servicio de asistencia por correo respondio con una plantilla generica que no resolvia mi problema especifico.","El sitio se desconecto varias veces durante el checkout un dia de alta demanda, tuve que reiniciar el proceso completo.","Recibi spam de terceros despues de registrarme, sospecho que compartieron mi correo con algun socio comercial.","El chat de soporte me transfirio tres veces a distintos agentes y tuve que repetir mi problema cada vez. Terminaron resolviendolo pero la experiencia fue frustrante.","El chat en vivo estuvo caido todo un fin de semana sin ningun aviso previo. Tuve que esperar hasta el lunes para resolver mi consulta.","El sistema de puntos se reinicio sin explicacion despues de una actualizacion de la plataforma. Perdi el saldo acumulado de varios meses.","El tiempo de espera del chat de soporte fue bastante largo un fin de semana. Entiendo que hay menos personal pero deberian avisar el tiempo estimado de espera.","Recibi un correo de confirmacion pero el pedido nunca aparecio en mi historial de compras. Tuve que llamar por telefono para confirmar que si se habia procesado."],"marker":{"opacity":0.5,"size":5},"mode":"markers+text","name":"0_soporte_correo_chat","text":["","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""],"te os podria mejorar, a veces no filtra bien por categoria.","El stock mostrado no siempre esta actualizado, un producto que queria ya no estaba disponible.","Buena variedad de marcas y precios competitivos frente a otras tiendas que revise antes de comprar. El unico punto negativo fue la demora en la confirmacion del pago.","El filtro de precio no se actualiza correctamente al combinarlo con marca.","El historial de compras no muestra el detalle completo de pedidos antiguos de hace mas de un ano.","El catalogo de marcas es decente aunque hay ciertos modelos que nunca llegan a tener stock.","Excelente variedad de marcas, encontre opciones que no tenia en otras tiendas.","Las fotos de un producto no coincidian del todo con el color que llego. No es un problema grave pero genera cierta desconfianza para futuras compras.","El precio de un producto cambio de un dia para otro sin ninguna explicacion clara. Senti que perdi la oportunidad de una oferta real.","Compre un producto marcado como disponible y luego me avisaron que no habia stock.","La seccion de preguntas frecuentes no cubre todos los casos que tuve."],"marker":{"opacity":0.5,"size":5},"mode":"markers+text","name":"3_marcas_stock_producto","text":["","","","","","","","","","","",""],"textfont":{"size":12},"x":{"dtype":"f4","bdata":"bTKEwK4pfsCM0nLAdzV8wPbJg8DFwnjAITuAwPOtfsBneYXAOeN2wIwQcsCrEXPA"},"y":{"dtype":"f4","bdata":"T0q4QAcruED4mpFAF2acQLdzs0CMZppA8xy\u002fQCfYy0C5yrlAknyMQKibkECGraRA"},"type":"scattergl"},{"hoverinfo":"text","hovertext":["La comparacion de especificaciones tecnicas podria ser mas detallada.","Las fotos de los productos son claras y las descripciones bastante completas.","Me gusto poder comparar hasta tres productos a la vez antes de decidir. Esa funcion me ahorro bastante tiempo en la busqueda.","Es facil guardar productos en una lista de deseos para comprarlos despues.","El sitio permite comparar hasta tres productos a la vez, muy util para decidir.","Los filtros de busqueda por precio
